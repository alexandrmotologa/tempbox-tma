name = "tempbox-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
DEFAULT_DOMAIN = "tempbox.dev"
ALLOWED_DOMAINS = "tempbox.dev,inbox.tempbox.dev,mail.tempbox.dev"
MINI_APP_URL = "https://t.me/tempbox_bot/app"
MAX_TTL_HOURS = 24
DEFAULT_TTL_MINUTES = 120

[[d1_databases]]
binding = "DB"
database_name = "tempbox-d1"
database_id = "tempbox-d1-placeholder"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"] # Purge expired mailboxes every 15 minutes
